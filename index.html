<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Autobing</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./img/icon32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./img/icon16.png">
    <link href="./css/bootstrap.min.css" rel="stylesheet">
    <link href="./css/fa-all.min.css" rel="stylesheet">
    <link href="./css/custom.css" rel="stylesheet">
</head>

<body>
    <!-- Header -->
    <div class="app-header text-center">
        <a href="https://github.com/fastdemo/autobing" target="_blank" rel="noopener noreferrer" class="header-link">
            <div class="header-icon">
                <img src="./img/icon256.png" alt="Autobing" width="48" height="48">
            </div>
        </a>
        <a href="https://github.com/fastdemo/autobing" target="_blank" rel="noopener noreferrer" class="title-link">
            <h1 class="app-title">Autobing</h1>
        </a>
        <p class="app-subtitle">Automating your searches.</p>
    </div>

    <div class="container-fluid px-3">
        <!-- Action Buttons -->
        <div class="row g-2">
            <div class="col-4" id="desktopButtonCol">
                <button type="button" class="btn btn-action btn-desktop w-100" id="desktopButton">
                    <i class="fa-solid fa-play"></i>
                    <span>Start</span>
                </button>
            </div>
            <div class="col-4" id="mobileButtonCol">
                <button type="button" class="btn btn-action btn-mobile w-100" id="mobileButton">
                    <i class="fa-solid fa-mobile-screen"></i>
                    <span>Mobile</span>
                </button>
            </div>
            <div class="col-4" id="desktopMobileButtonCol">
                <button type="button" class="btn btn-action btn-both w-100" id="desktopMobileButton">
                    <i class="fa-solid fa-layer-group"></i>
                    <span>Both</span>
                </button>
            </div>
        </div>

        <!-- Progress & Stats -->
        <div class="progress-wrap">
            <div class="row">
                <div class="col-12">
                    <div class="progress-track">
                        <div class="progress-bar" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-12">
                    <div class="search-stats" id="searchStats">
                        <span id="statsTimer">00:00</span>
                        <span class="stats-sep">•</span>
                        <span id="statsCount">0 / 0</span>
                        <span class="stats-sep">•</span>
                        <span id="statsPercent">0%</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Settings Form -->
        <div class="row gy-0">
            <div class="col-6" id="desktopSearchesCol">
                <label class="form-label" for="totDesktopSearchesForm">
                    <i class="fa-solid fa-magnifying-glass"></i> Searches
                </label>
                <div class="endless-input-wrap">
                    <input type="number" class="form-control form-control-sm" 
                        id="totDesktopSearchesForm" min="1" value="">
                    <button type="button" class="endless-toggle" id="endlessToggle" 
                        aria-label="Toggle endless mode" title="Endless mode">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12c-2-2.67-4-4-6-4a4 4 0 1 0 0 8c2 0 4-1.33 6-4Zm0 0c2 2.67 4 4 6 4a4 4 0 0 0 0-8c-2 0-4 1.33-6 4Z"/></svg>
                    </button>
                </div>
            </div>
            <div class="col-6" id="mobileSearchesCol">
                <label class="form-label" for="totMobileSearchesForm">
                    <i class="fa-solid fa-mobile-screen"></i> Mobile
                </label>
                <input type="number" class="form-control form-control-sm" 
                    id="totMobileSearchesForm" min="1" value="">
            </div>
        </div>

        <div class="row g-2">
            <div class="col-6">
                <label class="form-label" for="waitingBetweenSearchesFormMin">
                    <i class="fa-solid fa-hourglass-start"></i> Min (ms)
                </label>
                <input type="number" class="form-control form-control-sm"
                    id="waitingBetweenSearchesFormMin" min="100" value="">
            </div>
            <div class="col-6">
                <label class="form-label" for="waitingBetweenSearchesFormMax">
                    <i class="fa-solid fa-hourglass-end"></i> Max (ms)
                </label>
                <input type="number" class="form-control form-control-sm"
                    id="waitingBetweenSearchesFormMax" min="100" value="">
            </div>
        </div>

    </div>

    <!-- Settings View -->
    <div class="settings-view" id="settingsView" aria-hidden="true">
        <div class="settings-header">
            <button type="button" class="settings-back" id="settingsBack" aria-label="Back to dashboard">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
                <span>Back</span>
            </button>
            <span class="settings-title">Settings</span>
        </div>
        <div class="settings-content">
            <div class="settings-section-label">General</div>

            <div class="settings-card">
                <div class="setting-row">
                    <div class="tile-icon"><i class="fa-solid fa-leaf"></i></div>
                    <div class="content-col">
                        <label class="settings-row-title" for="eco-toggle">Eco Mode</label>
                        <span class="settings-row-subtitle">Stops loading search page DOM to save RAM and power.</span>
                    </div>
                    <button type="button" class="eco-toggle" id="eco-toggle" role="switch" aria-checked="false" aria-label="Toggle Eco Mode" title="Eco Mode">
                        <span class="eco-thumb"></span>
                    </button>
                </div>
            </div>

            <div class="settings-section-label">Search Queries</div>
            <p class="settings-section-note">Edit terms used to build unique random searches.</p>

            <div class="settings-card">
                <div class="setting-row">
                    <div class="row-header">
                        <div class="tile-icon"><i class="fa-solid fa-face-smile"></i></div>
                        <label class="settings-row-title" for="moodDescriptorsField">Descriptors</label>
                    </div>
                    <input type="text" class="settings-word-input" id="moodDescriptorsField" spellcheck="false" placeholder="best, easy, quick, ...">
                </div>
                <div class="setting-row">
                    <div class="row-header">
                        <div class="tile-icon"><i class="fa-solid fa-tags"></i></div>
                        <label class="settings-row-title" for="categoriesField">Categories</label>
                    </div>
                    <input type="text" class="settings-word-input" id="categoriesField" spellcheck="false" placeholder="coffee shops, dinner recipes, ...">
                </div>
                <div class="setting-row">
                    <div class="row-header">
                        <div class="tile-icon"><i class="fa-solid fa-info"></i></div>
                        <label class="settings-row-title" for="extraDetailsField">Extras</label>
                    </div>
                    <input type="text" class="settings-word-input" id="extraDetailsField" spellcheck="false" placeholder="near me, for beginners, ...">
                </div>
            </div>

            <div class="settings-section-label">Statistics</div>

            <div class="settings-card">
                <div class="setting-row">
                    <div class="content-col">
                        <div class="combo-stats" id="comboStats" aria-live="polite">
                            <div class="combo-card">
                                <span class="combo-card-value" id="comboSearches">0</span>
                                <span class="combo-card-label">Searches</span>
                            </div>
                            <div class="combo-card">
                                <span class="combo-card-value" id="comboTotal">0</span>
                                <span class="combo-card-label">Combos</span>
                            </div>
                            <div class="combo-card">
                                <span class="combo-card-value" id="comboPercent">0%</span>
                                <span class="combo-card-label">Pool</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <button type="button" class="btn btn-action settings-reset-btn w-100" id="settingsReset">
                <i class="fa-solid fa-rotate-left reset-icon"></i>
                <span class="reset-label">Restore settings</span>
            </button>
        </div>
    </div>

    <!-- Footer -->
    <nav class="navbar navbar-expand fixed-bottom app-footer">
        <div class="container-fluid">
            <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
                <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            </button>
            <span class="footer-version version-tag" id="appVersion" title="v1.4.0">
                <span class="text-default">v1.4.0</span>
                <span class="text-hover">@fastdemo</span>
            </span>
            <button type="button" class="theme-toggle" id="settingsToggle" aria-label="Settings">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </button>
        </div>
    </nav>

    <script src="./js/jquery-3.6.0.min.js"></script>
    <script src="./js/fa-all.min.js"></script>
    <script type="module" src="./js/popup.js"></script>
</body>

</html>
